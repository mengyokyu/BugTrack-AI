apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: bugtrack}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - {name: POSTGRES_DB, value: bugtrack}
        - {name: POSTGRES_USER, value: bugtrack}
        - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: bugtrack-secrets, key: SECRET_KEY}}}
        ports: [{containerPort: 5432}]
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: postgres-pvc}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: bugtrack}
spec: {selector: {app: postgres}, ports: [{port: 5432, targetPort: 5432}]}
