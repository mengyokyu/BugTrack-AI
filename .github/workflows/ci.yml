name: BugTrack AI CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check app tests run.py --ignore E701,E702
      - name: Unit tests
        run: python -m pytest -q --cov=app --cov-report=term-missing
      - name: SonarQube analysis
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  image:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image
        run: docker build --tag bugtrack-ai:${{ github.sha }} .
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: bugtrack-ai:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - name: Tag and push image
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: |
          image="$DOCKERHUB_USERNAME/bugtrack-ai"
          docker tag bugtrack-ai:${{ github.sha }} "$image:${{ github.sha }}"
          docker tag bugtrack-ai:${{ github.sha }} "$image:latest"
          docker push "$image:${{ github.sha }}"
          docker push "$image:latest"
      - name: Update GitOps image tag
        if: github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != ''
        run: |
          sed -i "s#newTag:.*#newTag: ${{ github.sha }}#" gitops/overlays/blue/kustomization.yaml
          sed -i "s#newTag:.*#newTag: ${{ github.sha }}#" gitops/overlays/green/kustomization.yaml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add gitops/overlays
          git commit -m "gitops: update image to ${{ github.sha }}" || true
          git push
