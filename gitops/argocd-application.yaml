apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bugtrack-ai
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_OWNER/REPLACE_REPO.git
    targetRevision: main
    path: gitops/overlays/blue
  destination:
    server: https://kubernetes.default.svc
    namespace: bugtrack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: [CreateNamespace=true]
