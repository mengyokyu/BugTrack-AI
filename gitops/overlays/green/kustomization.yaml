apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
images:
  - name: ghcr.io/mengyokyu/bugtrack-ai
    newName: ghcr.io/mengyokyu/bugtrack-ai
    newTag: latest
patches:
  - target: {kind: Service, name: bugtrack}
    patch: |-
      - op: replace
        path: /spec/selector/version
        value: green
