{% extends 'base.html' %}{% block content %}<section class="card form-card"><p class="eyebrow">Issue intake</p><h1>Report a bug</h1><form id="bug-form"><label>Title<input name="title" required maxlength="200"></label><label>Description<textarea name="description" rows="6" required></textarea></label><div class="grid2"><label>Severity<select name="severity"><option>LOW</option><option selected>MEDIUM</option><option>HIGH</option><option>CRITICAL</option></select></label><label>Environment<input name="environment" value="development"></label></div><button>Create bug</button><p id="message"></p></form></section>{% endblock %}
