- hosts: local
  become: true
  tasks:
    - name: Install kubectl
      get_url: {url: https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl, dest: /usr/local/bin/kubectl, mode: '0755'}
    - name: Install Minikube
      get_url: {url: https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64, dest: /usr/local/bin/minikube, mode: '0755'}
