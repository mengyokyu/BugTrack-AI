services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bugtrack
      POSTGRES_USER: bugtrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugtrack -d bugtrack"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports: ["5000:5000"]
    environment:
      DATABASE_URL: postgresql+psycopg2://bugtrack:${POSTGRES_PASSWORD:-local-dev-password}@db:5432/bugtrack
      SECRET_KEY: ${SECRET_KEY:-local-compose-secret}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_URL: ${AI_API_URL:-https://api.openai.com/v1/chat/completions}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  postgres_data:
